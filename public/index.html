<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google SSO POC</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --border: #dadce0;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131314;
          --fg: #e3e3e3;
          --muted: #9aa0a6;
          --border: #3c4043;
          --card: #1e1f20;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { width: min(420px, calc(100vw - 32px)); text-align: center; }
      .gsi {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 20px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--card);
        color: var(--fg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      .gsi:hover { background: color-mix(in srgb, var(--fg) 6%, var(--card)); }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        background: var(--card);
        text-align: left;
      }
      .who { display: flex; align-items: center; gap: 12px; }
      .who img { width: 48px; height: 48px; border-radius: 50%; }
      .name { font-weight: 600; }
      .muted { color: var(--muted); font-size: 13px; }
      pre {
        margin: 16px 0 0;
        padding: 12px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--fg) 6%, var(--card));
        overflow-x: auto;
        font-size: 12px;
      }
      .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      button.plain {
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script>
      const app = document.getElementById('app');

      const googleG = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.77 24c0-1.6.28-3.14.76-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.88.93 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>`;

      function renderSignedOut() {
        app.innerHTML = `<a class="gsi" href="/auth/google">${googleG}<span>Sign in with Google</span></a>`;
      }

      function renderSignedIn(data) {
        const p = data.profile;
        app.innerHTML = `
          <div class="card">
            <div class="who">
              ${p.picture ? `<img src="${p.picture}" alt="" referrerpolicy="no-referrer" />` : ''}
              <div>
                <div class="name">${p.name ?? '(no name)'}</div>
                <div class="muted">${p.email ?? ''}${p.email_verified ? ' · verified' : ''}</div>
              </div>
            </div>
            <pre id="detail">${JSON.stringify(
              { subject: p.sub, accessToken: data.token },
              null,
              2
            )}</pre>
            <div class="row">
              <button class="plain" id="call">Call Google API with the token</button>
              <button class="plain" id="logout">Sign out</button>
            </div>
          </div>`;

        document.getElementById('call').onclick = async () => {
          const res = await fetch('/api/google/userinfo');
          document.getElementById('detail').textContent = JSON.stringify(await res.json(), null, 2);
        };
        document.getElementById('logout').onclick = async () => {
          await fetch('/logout', { method: 'POST' });
          renderSignedOut();
        };
      }

      (async () => {
        const res = await fetch('/api/me');
        if (res.ok) renderSignedIn(await res.json());
        else renderSignedOut();
      })();
    </script>
  </body>
</html>
